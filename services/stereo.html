<section class="service-hero"><div class="container"><div class="breadcrumbs"><a href="../index.html">Главная</a> / Stereo Checker</div><div class="eyebrow"><span class="dot"></span> WIDTH</div><h1>Stereo Checker</h1><p class="lead">Учебная модель для оценки условной стерео-ширины по двум каналам и флагу проверки mono.</p></div></section><section class="section"><div class="container grid grid-2"><div class="card"><div class="range-row"><label>Left level</label><input id="l" type="range" min="0" max="100" value="80"><output>80</output></div><div class="range-row" style="margin-top:14px"><label>Right level</label><input id="r" type="range" min="0" max="100" value="75"><output>75</output></div><label class="check" style="margin-top:18px"><input id="mono" type="checkbox"> Mono compatibility mode</label><button class="btn primary" id="analyze" style="margin-top:18px">Analyze</button></div><div class="card"><div class="kicker">Результат</div><div class="score" id="w">0%</div><p id="msg" class="muted"></p><div class="meter"><span id="bar"></span></div></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('input[type=range]').forEach(x=>x.oninput=()=>x.parentElement.querySelector('output').value=x.value);const a=()=>{const l=Number(document.querySelector('#l').value),r=Number(document.querySelector('#r').value),mono=document.querySelector('#mono').checked,spread=Math.abs(l-r),w=Math.round((100-spread)*(mono?.8:1));document.querySelector('#w').textContent=w+'%';document.querySelector('#bar').style.width=Math.max(0,Math.min(100,w))+'%';document.querySelector('#msg').textContent=mono?'Проверка в mono режиме: следи за потерей ключевых элементов.':w>90?'Условно устойчивое L/R распределение.':'Стоит проверить баланс каналов и панораму.'};document.querySelector('#analyze').onclick=a;a()});</script>
