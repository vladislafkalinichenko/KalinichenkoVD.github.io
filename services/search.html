<section class="service-hero"><div class="container"><div class="breadcrumbs"><a href="../index.html">Главная</a> / Поиск</div><div class="eyebrow"><span class="dot"></span> SEARCH</div><h1>Поиск по сайту</h1><p class="lead">Поиск выполняется по названию страницы, описанию и ключевым словам.</p></div></section><section class="section"><div class="container"><div class="card"><div class="form-grid"><div class="field full"><label for="q">Поисковый запрос</label><input id="q" placeholder="например: компрессия, stereo, LUFS"></div></div><div class="actions"><button class="btn primary" id="go">Искать</button><button class="btn" id="all">Показать всё</button></div><div id="results" style="margin-top:18px"></div></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>{const r=()=>{const q=document.querySelector('#q').value.trim().toLowerCase();const data=MixLab.SITE_PAGES.filter(x=>!q||(`${x.title} ${x.keywords}`).toLowerCase().includes(q));const out=document.querySelector('#results');out.innerHTML=data.length?data.map(x=>`<div class="search-item"><a href="../${x.url}"><b>${x.title}</b></a><div class="muted small">${x.keywords}</div></div>`).join(''):'<div class="empty">Ничего не найдено.</div>'};document.querySelector('#go').onclick=r;document.querySelector('#all').onclick=()=>{document.querySelector('#q').value='';r()};document.querySelector('#q').addEventListener('input',r);r()});</script>
