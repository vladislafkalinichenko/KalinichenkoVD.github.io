<main>
<section class="service-hero"><div class="container"><div class="breadcrumbs"><a href="../index.html">Главная</a> / Compressor Assistant</div><div class="eyebrow"><span class="dot"></span> DYNAMICS TOOL</div><h1>Compressor Assistant</h1><p class="lead">Подбор стартовых параметров по типу материала. Это не «правильные значения», а отправная точка для слуховой настройки.</p></div></section><section class="section"><div class="container grid grid-2"><div class="card"><div class="field"><label>Материал</label><select id="type"><option value="vocal">Вокал</option><option value="drums">Drums / Bus</option><option value="bass">Bass</option><option value="mix">Mix Bus</option></select></div><button class="btn primary" id="suggest" style="margin-top:14px">Подобрать старт</button></div><div class="card" id="out"></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>{const presets={vocal:['3:1','10–25 ms','60–120 ms','2–5 dB'],drums:['4:1','10–30 ms','50–120 ms','3–6 dB'],bass:['4:1','15–35 ms','80–160 ms','3–6 dB'],mix:['2:1','20–40 ms','80–200 ms','1–3 dB']};const render=()=>{const p=presets[document.querySelector('#type').value];document.querySelector('#out').innerHTML=`<h3>Стартовые значения</h3><ul class="list"><li><b>Ratio:</b> ${p[0]}</li><li><b>Attack:</b> ${p[1]}</li><li><b>Release:</b> ${p[2]}</li><li><b>Gain Reduction:</b> ${p[3]}</li></ul><p class="muted small">Дальше слушай envelope и подстраивай параметры под фразу/грув.</p>`};document.querySelector('#suggest').onclick=render;render()});</script>
