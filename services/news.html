<section class="service-hero"><div class="container"><div class="breadcrumbs"><a href="../index.html">Главная</a> / Новости</div><div class="eyebrow"><span class="dot"></span> NEWS BOARD</div><h1>Новости</h1><p class="lead">Доска обновлений сайта. Новые записи можно добавлять без серверной части.</p></div></section><section class="section"><div class="container split"><div class="card"><h3>Добавить новость</h3><div class="field"><label for="headline">Заголовок</label><input id="headline"></div><div class="field" style="margin-top:12px"><label for="newsbody">Текст</label><textarea id="newsbody"></textarea></div><button class="btn primary" id="addNews" style="margin-top:12px">Опубликовать</button></div><div class="card"><h3>Лента</h3><div id="feed"></div></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>{const seed=[{h:'Запущен MIXLAB',b:'Статический проект по сведению музыки собран в едином интерфейсе.',ts:Date.now()-86400000*3},{h:'Добавлены сервисы',b:'В проект включены поиск, гостевая книга, форум, рейтинг, статистика и микс-инструменты.',ts:Date.now()-86400000}];const render=()=>{let a=MixLab.getJSON('mixlab_news',null);if(!a){a=seed;MixLab.setJSON('mixlab_news',a)}document.querySelector('#feed').innerHTML=a.slice().reverse().map(x=>`<div class="search-item"><b>${MixLab.esc(x.h)}</b><div class="muted small">${MixLab.formatDate(x.ts)}</div><p>${MixLab.esc(x.b)}</p></div>`).join('')};document.querySelector('#addNews').onclick=()=>{const h=document.querySelector('#headline').value.trim(),b=document.querySelector('#newsbody').value.trim();if(!h||!b)return alert('Заполните оба поля.');const a=MixLab.getJSON('mixlab_news',[]);a.push({h,b,ts:Date.now()});MixLab.setJSON('mixlab_news',a);document.querySelector('#headline').value='';document.querySelector('#newsbody').value='';render()};render()});</script>
