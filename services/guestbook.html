<main>
<section class="service-hero"><div class="container"><div class="breadcrumbs"><a href="../index.html">Главная</a> / Гостевая книга</div><div class="eyebrow"><span class="dot"></span> GUESTBOOK</div><h1>Гостевая книга</h1><p class="lead">Посетитель оставляет сообщение; записи сохраняются в браузере этого устройства.</p></div></section><section class="section"><div class="container grid grid-2"><div class="card"><h3>Оставить сообщение</h3><div class="field"><label for="name">Имя</label><input id="name" maxlength="40"></div><div class="field" style="margin-top:12px"><label for="msg">Сообщение</label><textarea id="msg" maxlength="400"></textarea></div><button class="btn primary" id="add" style="margin-top:12px">Добавить</button></div><div class="card"><h3>Сообщения</h3><div id="guestList"></div></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>{const render=()=>{const a=MixLab.getJSON('mixlab_guestbook',[]);document.querySelector('#guestList').innerHTML=a.length?a.slice().reverse().map(x=>`<div class="post" style="margin-bottom:16px"><div class="avatar">${MixLab.esc((x.name||'?')[0].toUpperCase())}</div><div class="post-content"><b>${MixLab.esc(x.name||'Гость')}</b><div class="muted small">${MixLab.formatDate(x.ts)}</div><p>${MixLab.esc(x.msg)}</p></div></div>`).join(''):'<div class="empty">Пока нет записей.</div>'};document.querySelector('#add').onclick=()=>{const name=document.querySelector('#name').value.trim()||'Гость',msg=document.querySelector('#msg').value.trim();if(!msg)return alert('Введите сообщение.');const a=MixLab.getJSON('mixlab_guestbook',[]);a.push({name,msg,ts:Date.now()});MixLab.setJSON('mixlab_guestbook',a);document.querySelector('#msg').value='';render()};render()});</script>
</main>
